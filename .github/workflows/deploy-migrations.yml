name: Deploy Database Migrations

# Applies the numbered SQL in migrations/ to the hosted Supabase database using
# the official Supabase CLI (`supabase db push`) whenever a migration changes on
# main. The CLI records applied versions in supabase_migrations.schema_migrations,
# so each push only runs what's new.
#
# migrations/ is the single source of truth; supabase/migrations is a symlink to
# it (the CLI reads from supabase/migrations/).
#
# ── One-time setup before the first push ──────────────────────────────────────
#  1. Add three repo secrets (Settings → Secrets and variables → Actions):
#       SUPABASE_ACCESS_TOKEN  – personal token from https://supabase.com/dashboard/account/tokens
#       SUPABASE_PROJECT_ID    – the 20-char project ref (dashboard URL / General settings)
#       SUPABASE_DB_PASSWORD   – the database password
#  2. Baseline the existing prod DB ONCE. Its 0001..NNNN were applied by hand, so
#     its migration-history table is empty and a first `db push` would try to
#     re-run them and fail on the already-existing tables. Record them as applied
#     WITHOUT running them (run locally, from the repo root):
#       export SUPABASE_ACCESS_TOKEN=...   SUPABASE_DB_PASSWORD=...
#       supabase link --project-ref <SUPABASE_PROJECT_ID>
#       supabase migration repair --status applied \
#         $(ls migrations/*.sql | xargs -n1 basename | cut -d_ -f1)
#     After that, `db push` reports "Remote database is up to date" and only new
#     migrations get applied.

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'          # source of truth
      - 'supabase/**'            # config.toml / migrations symlink
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:             # manual trigger from the Actions tab

jobs:
  deploy:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: prod

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Apply migrations
        run: supabase db push
