name: Apply Supabase Migrations

# Runs the numbered SQL in migrations/ against the Supabase database whenever
# a migration file (or the runner) changes on main. The runner tracks applied
# versions in a schema_migrations table, so re-runs only apply what's new.
#
# One-time setup before the first push:
#   1. Add a repo secret SUPABASE_DB_URL — the **Session pooler** connection
#      string from Supabase (Project Settings → Database → Connection string).
#      Use the pooler URI, not the direct one: GitHub runners are IPv4-only and
#      Supabase's direct connection is IPv6-only.
#   2. Baseline the existing prod DB once (its schema already matches
#      migrations/), so the action doesn't try to re-run 0001..NNNN:
#         DATABASE_URL='<SUPABASE_DB_URL>' ./scripts/migrate.sh --baseline
#      Run it locally, or trigger this workflow via "Run workflow" after
#      temporarily flipping the step to pass --baseline.

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'scripts/migrate.sh'
      - '.github/workflows/migrate.yml'
  # Manual trigger, e.g. to re-run after adding the secret or to baseline.
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Record all migrations as applied WITHOUT running them (one-time baseline)'
        type: boolean
        default: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # psql ships on ubuntu-latest runners, but install explicitly so the job
      # doesn't silently break if that ever changes.
      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "✗ SUPABASE_DB_URL secret is not set." >&2
            exit 1
          fi
          if [ "${{ github.event.inputs.baseline }}" = "true" ]; then
            ./scripts/migrate.sh --baseline
          else
            ./scripts/migrate.sh
          fi
