<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0D6E66" />

    <!-- Theme boot: set the `.dark` class before first paint so there's no
         light-mode flash. Reads the saved override ('light'|'dark'), else falls
         back to the OS preference. Kept in sync afterward by lib/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tandem.theme");
          var dark =
            saved === "dark" ||
            ((saved === null || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <!-- Primary SEO. The <title>, description, and og/twitter TITLES are
         keyword-first for search discovery: they name the things people actually
         type ("AI canvas", "MCP", "shared canvas", "AI agents") so Tandem is
         findable by concept, not just by brand. The og/twitter DESCRIPTIONS still
         lead with the reversed-causality hook ("Claude made this") — that's the
         human-facing click driver in a link preview — but even they now work the
         core keywords in. The bare word "Tandem" is kept everywhere for
         brand/domain search. -->
    <title>Tandem — a shared AI canvas for you and your agents, over MCP</title>
    <meta
      name="description"
      content="Tandem is a shared AI canvas you and your AI agents co-edit in real time over MCP. The work your AI does in a chat usually vanishes into a scroll you never find again — Tandem is where Claude leaves it, as a real artifact you can open, edit, and keep. A collaborative canvas for humans and AI agents. Connect Claude, Cursor, or any MCP client."
    />
    <meta
      name="keywords"
      content="AI canvas, shared canvas, MCP, Model Context Protocol, AI agents, collaborative canvas, human-AI collaboration, Claude canvas, MCP server, real-time canvas, agent workspace, Tandem, Tandem Canvas"
    />
    <link rel="canonical" href="https://tandemcanvas.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Tandem Canvas" />

    <!-- Open Graph (link previews on Slack, iMessage, LinkedIn, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tandem Canvas" />
    <meta property="og:title" content="Tandem — a shared AI canvas for you and your agents, over MCP" />
    <meta
      property="og:description"
      content="A shared AI canvas you and your AI agents co-edit in real time over MCP. You ask in the chat you're already in; Claude does the work and leaves a real artifact you can open, edit, and keep. A doc has no agent. An MCP server has no human. This is the one thing that's both."
    />
    <meta property="og:url" content="https://tandemcanvas.com/" />
    <meta property="og:image" content="https://tandemcanvas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tandem — a shared AI canvas for you and your agents, over MCP" />
    <meta
      name="twitter:description"
      content="A shared AI canvas for you and your AI agents, over MCP. You ask in the chat you're already in; Claude does the work and leaves a real artifact you can open, edit, and keep — not a doc you fill in, not plumbing you never see."
    />
    <meta name="twitter:image" content="https://tandemcanvas.com/og-image.png" />

    <!-- Structured data: helps search engines understand the brand + product. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Tandem Canvas",
            "alternateName": "Tandem",
            "url": "https://tandemcanvas.com/"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Tandem Canvas",
            "alternateName": "Tandem — shared AI canvas over MCP",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://tandemcanvas.com/",
            "description": "Tandem is a shared AI canvas you and your AI agents co-edit in real time over MCP (Model Context Protocol). The work your AI does in chat becomes a real artifact you can open, edit, and keep. Connect Claude, Cursor, or any MCP client.",
            "keywords": "AI canvas, shared canvas, MCP, Model Context Protocol, AI agents, collaborative canvas, Claude",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600;1,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
