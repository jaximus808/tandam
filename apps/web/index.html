<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0D6E66" />

    <!-- Theme boot: set the `.dark` class before first paint so there's no
         light-mode flash. Reads the saved override ('light'|'dark'), else falls
         back to the OS preference. Kept in sync afterward by lib/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tandem.theme");
          var dark =
            saved === "dark" ||
            ((saved === null || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <!-- Primary SEO. Search and social pull in opposite directions here, so they
         get different copy on purpose:
           · <title>/<description> are the *search* surface — they describe the
             category in the words people actually type ("shared canvas", "MCP",
             "AI agents") rather than the brand line, which only ever matched
             people already searching for Tandem by name.
           · og:/twitter: below keep the reversed-causality hook ("Claude made
             this") — a link preview that reads as a feature list loses the
             "Google already does that" argument before anyone clicks.
         The bare word "Tandem" stays everywhere for brand/domain search. -->
    <title>Tandem — a shared MCP canvas for you and your AI agents</title>
    <meta
      name="description"
      content="A shared canvas humans and AI agents edit together in real time. Connect Claude or any MCP client — the plan, map, or sheet your agent builds is a real artifact you can open, edit, and keep."
    />
    <meta
      name="keywords"
      content="AI canvas, shared canvas, MCP, Model Context Protocol, AI agents, collaborative canvas, human-AI collaboration, Claude canvas, MCP server, real-time canvas, agent workspace, Tandem, Tandem Canvas"
    />
    <link rel="canonical" href="https://tandemcanvas.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Tandem Canvas" />

    <!-- Open Graph (link previews on Slack, iMessage, LinkedIn, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tandem Canvas" />
    <meta property="og:title" content="Tandem — a shared AI canvas for you and your agents, over MCP" />
    <meta
      property="og:description"
      content="A shared AI canvas you and your AI agents co-edit in real time over MCP. You ask in the chat you're already in; Claude does the work and leaves a real artifact you can open, edit, and keep. A doc has no agent. An MCP server has no human. This is the one thing that's both."
    />
    <meta property="og:url" content="https://tandemcanvas.com/" />
    <meta property="og:image" content="https://tandemcanvas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tandem — a shared AI canvas for you and your agents, over MCP" />
    <meta
      name="twitter:description"
      content="A shared AI canvas for you and your AI agents, over MCP. You ask in the chat you're already in; Claude does the work and leaves a real artifact you can open, edit, and keep — not a doc you fill in, not plumbing you never see."
    />
    <meta name="twitter:image" content="https://tandemcanvas.com/og-image.png" />

    <!-- Structured data: helps search engines understand the brand + product.
         The FAQ mirrors the visible FAQ section on the landing page (they must
         stay in sync — Google penalises structured data that isn't on the page)
         and is what answer engines quote when asked "what is an MCP canvas". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Tandem Canvas",
            "alternateName": ["Tandem", "Tandem MCP Canvas"],
            "url": "https://tandemcanvas.com/"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Tandem Canvas",
            "alternateName": "Tandem — shared AI canvas over MCP",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Collaborative canvas / MCP server",
            "operatingSystem": "Web",
            "url": "https://tandemcanvas.com/",
            "description": "A shared canvas humans and AI agents edit together in real time over the Model Context Protocol (MCP). Connect Claude or any MCP client and the plan, map, schedule, or sheet your agent builds becomes a real artifact you can open, edit, and keep.",
            "keywords": "AI canvas, shared canvas, MCP, Model Context Protocol, AI agents, collaborative canvas, Claude",
            "featureList": [
              "Shared canvas edited live by humans and AI agents",
              "Model Context Protocol (MCP) server — works with Claude and any MCP client",
              "Real-time multiplayer editing over WebSocket",
              "Maps, schedules, roadmaps, sheets, docs and charts in one canvas",
              "Multiple agents on the same canvas at the same time"
            ],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is an MCP canvas?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "An MCP canvas is a shared workspace an AI agent can read and write through the Model Context Protocol, while a human edits the same thing live in a browser. Tandem is one: your agent adds pins, events, rows, or notes over MCP and they appear on the canvas instantly, with no copy-pasting out of a chat window."
                }
              },
              {
                "@type": "Question",
                "name": "Which AI agents can connect to a Tandem canvas?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Any MCP-aware client. Claude Desktop, Claude Code, and claude.ai connect through the hosted connector or the npm package @jaximus/tandem-mcp; editors, agent frameworks, and custom orchestrators can spawn the same stdio server. Several agents can work on one canvas at the same time."
                }
              },
              {
                "@type": "Question",
                "name": "How is a shared canvas different from a Google Doc?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A doc has no agent and an MCP server has no human. Tandem is both: the AI agent builds the artifact and you edit it in the same place, in real time. It also isn't a single document shape — the canvas becomes a map, a schedule, a roadmap, a sheet, or a doc depending on what you asked for."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need an account to use Tandem?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Create a canvas, get a short code, and share it — anyone with the code can open and edit it in the browser and any agent can join with the same code. Signing in with Google is only needed if you want to keep canvases in a dashboard or make one private."
                }
              }
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600;1,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
