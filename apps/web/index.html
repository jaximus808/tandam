<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0D6E66" />

    <!-- Theme boot: set the `.dark` class before first paint so there's no
         light-mode flash. Reads the saved override ('light'|'dark'), else falls
         back to the OS preference. Kept in sync afterward by lib/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tandem.theme");
          var dark =
            saved === "dark" ||
            ((saved === null || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <!-- Primary SEO. The <title> is keyword-first for search discovery: it names
         the things people actually type ("AI canvas", "MCP", "shared canvas",
         "AI agents") so Tandem is findable by concept, not just by brand. The
         social CARD copy below (og/twitter) still leads with reversed causality
         ("Claude made this") — a link preview that names docs/sheets/canvas loses
         the "Google already does that" argument before anyone clicks. Two
         different audiences: search crawlers read the title, humans read the card.
         The bare word "Tandem" is kept in the <title> for brand/domain search. -->
    <title>Tandem — a shared AI canvas for you and your agents, over MCP</title>
    <meta
      name="description"
      content="The work your AI does in a chat usually vanishes into a scroll you never find again. Tandem is where Claude leaves it — a real artifact you can open, edit, and keep. Not a doc you fill in, not plumbing you never see."
    />
    <link rel="canonical" href="https://tandemcanvas.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Tandem Canvas" />

    <!-- Open Graph (link previews on Slack, iMessage, LinkedIn, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tandem Canvas" />
    <meta property="og:title" content="Claude made this. You keep it." />
    <meta
      property="og:description"
      content="You ask in the chat you're already in. Claude does the work and leaves a real artifact you can open, edit, and keep. A doc has no agent. An MCP server has no human. This is the one thing that's both."
    />
    <meta property="og:url" content="https://tandemcanvas.com/" />
    <meta property="og:image" content="https://tandemcanvas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Claude made this. You keep it." />
    <meta
      name="twitter:description"
      content="You ask in the chat you're already in. Claude does the work and leaves a real artifact you can open, edit, and keep — not a doc you fill in, not plumbing you never see."
    />
    <meta name="twitter:image" content="https://tandemcanvas.com/og-image.png" />

    <!-- Structured data: helps search engines understand the brand + product. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Tandem Canvas",
            "alternateName": "Tandem",
            "url": "https://tandemcanvas.com/"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Tandem Canvas",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://tandemcanvas.com/",
            "description": "Where the work your AI does in chat becomes a real artifact you can open, edit, and keep.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600;1,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
