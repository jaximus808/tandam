<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAFAFA" />

    <!-- Theme boot: set the `.dark` class before first paint so there's no
         light-mode flash. Reads the saved override ('light'|'dark'), else falls
         back to the OS preference. Kept in sync afterward by lib/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tandem.theme");
          var dark =
            saved === "dark" ||
            ((saved === null || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <!-- Primary SEO. Everything below sells one story: the coordination plane
         for agent fleets that span machines and models. The link-preview copy
         (og:/twitter:) especially must read as agent coordination, never
         document editing — a preview that sounds like a shared doc loses to
         "Google already does sheets and docs" before anyone clicks.
         The bare word "Tandem" stays everywhere for brand/domain search. -->
    <title>Tandem — the coordination plane for agent fleets</title>
    <meta
      name="description"
      content="One hosted queue for agents that span machines and models. Claude Code, Codex, Cursor, cloud sandboxes, or any MCP client pulls approved work and claims it atomically — no double work, one shared briefing, and a human approval gate on everything that lands."
    />
    <meta
      name="keywords"
      content="agent task queue, multi-agent coordination, agent fleet, parallel agent sessions, cloud agent sandboxes, Claude Code, Codex, Cursor, MCP, Model Context Protocol, agent orchestration, AI agents, shared agent context, human approval gate, Tandem, Tandem Canvas"
    />
    <link rel="canonical" href="https://tandemcanvas.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Tandem Canvas" />

    <!-- Open Graph (link previews on Slack, iMessage, LinkedIn, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tandem Canvas" />
    <meta property="og:title" content="Tandem — the coordination plane for agent fleets" />
    <meta
      property="og:description"
      content="Your agents don't share a filesystem: half the fleet runs in cloud sandboxes and you're on another machine entirely. Tandem gives them one hosted queue to claim work from, one briefing they all read, and an approval gate you hold — over plain MCP, so Claude Code, Codex, Cursor and CI jobs all join the same board."
    />
    <meta property="og:url" content="https://tandemcanvas.com/" />
    <meta property="og:image" content="https://tandemcanvas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tandem — the coordination plane for agent fleets" />
    <meta
      name="twitter:description"
      content="One hosted queue for agents spread across machines and vendors. Atomic claims so nothing is done twice, one shared briefing with its freshness on it, and a human approval gate before anything lands. Claude Code, Codex, Cursor, CI — any MCP client."
    />
    <meta name="twitter:image" content="https://tandemcanvas.com/og-image.png" />

    <!-- Structured data: helps search engines understand the brand + product.
         The FAQ mirrors the visible FAQ section on the landing page (they must
         stay in sync — Google penalises structured data that isn't on the page)
         and is what answer engines quote when asked how to coordinate parallel
         agent sessions. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Tandem Canvas",
            "alternateName": ["Tandem", "Tandem MCP"],
            "url": "https://tandemcanvas.com/"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Tandem Canvas",
            "alternateName": "Tandem — coordination plane for agent fleets",
            "applicationCategory": "DeveloperApplication",
            "applicationSubCategory": "Agent task queue / MCP server",
            "operatingSystem": "Web",
            "url": "https://tandemcanvas.com/",
            "description": "The coordination plane for AI agent fleets that span machines and models. A hosted task queue any agent can pull approved work from over the Model Context Protocol (MCP) and claim atomically — plus one shared briefing every agent reads, a human approval gate on what runs, and a live board of who's doing what. Works with Claude Code, Codex, Cursor, cloud sandboxes, CI jobs, and any MCP client.",
            "keywords": "agent task queue, agent fleet coordination, multi-agent coordination, MCP, Model Context Protocol, Claude Code, Codex, Cursor, agent orchestration, human approval gate",
            "featureList": [
              "Hosted task queue any agent can claim from — no shared filesystem required",
              "Atomic claims with a TTL so two agents never do the same task",
              "Shared context briefing with freshness (fresh / aging / stale) every agent reads",
              "Approval gate — only human-approved tasks are handed out",
              "Task results traceable back to commits",
              "Live board of what every agent is doing, updated over WebSocket",
              "Model Context Protocol (MCP) server — vendor-neutral, works with Claude Code, Codex, Cursor, CI jobs, and any MCP client"
            ],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is a coordination plane for agents?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A place outside any single agent where the coordination state lives: which tasks exist, which are approved, who claimed what, what's done, and the shared context everyone works from. In Tandem that's a hosted queue every agent reads and writes over the Model Context Protocol, while you watch the same board live in a browser."
                }
              },
              {
                "@type": "Question",
                "name": "Which AI agents can connect to Tandem?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Any MCP-aware client. Claude Code, Claude Desktop, and claude.ai connect through the hosted connector or the npm package @jaximus/tandem-mcp; Codex, Cursor, agent frameworks, CI jobs, and custom orchestrators spawn the same stdio server. Sessions on different machines, from different vendors, can work the same queue at the same time."
                }
              },
              {
                "@type": "Question",
                "name": "Why not just keep a TODO.md in the repo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A file works while everything runs in one checkout. It stops working the moment part of your fleet runs in cloud sandboxes with their own clone, or you're supervising from a different machine: there is no shared disk to write the claim to, and a file has no notion of who holds what right now. Tandem splits it — intent stays in git, and the churn (claims, statuses, results) moves to a queue every machine can reach."
                }
              },
              {
                "@type": "Question",
                "name": "How does Tandem stop agents from acting without approval?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tasks land as proposed. Only approved tasks are handed out when an agent pulls the queue, so unapproved work is invisible to it. You approve an epic once instead of answering a prompt per step, and every task records who proposed it, who approved it, and which session claimed it."
                }
              },
              {
                "@type": "Question",
                "name": "Why review agent plans instead of their code?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Because a plan is a paragraph and the code it produces is a diff. Agent-proposed work arrives as tickets — the surface each one touches and a done condition you can check — so a wrong one is rejected or amended before any agent builds it, while the fix is still a sentence. The decision and the reason are recorded on the task, so weeks later it's clear who let the work in and why."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need an account to use Tandem?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Create a canvas, get a short code, and share it — anyone with the code can open it in the browser and any agent session can join with the same code. Signing in with Google is only needed if you want to keep canvases in a dashboard or make one private."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- JetBrains Mono only — machine text (tickets, hashes, terminal content,
         canvas codes). Inter, the UI face, is self-hosted via fontsource. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
