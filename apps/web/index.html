<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAFAFA" />

    <!-- Theme boot: set the `.dark` class before first paint so there's no
         light-mode flash. Reads the saved override ('light'|'dark'), else falls
         back to the OS preference. Kept in sync afterward by lib/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tandem.theme");
          var dark =
            saved === "dark" ||
            ((saved === null || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <!-- Primary SEO. Everything below sells one story: shared state for teams
         running parallel agent sessions. The link-preview copy (og:/twitter:)
         especially must read as agent coordination, never document editing —
         a preview that sounds like a shared doc loses to "Google already does
         sheets and docs" before anyone clicks.
         The bare word "Tandem" stays everywhere for brand/domain search. -->
    <title>Tandem — shared state for parallel AI agent sessions</title>
    <meta
      name="description"
      content="A durable task queue for teams running parallel agent sessions. Claude Code, Cursor, or any MCP client claims tasks without colliding; you approve an epic once, watch the live board, and trace every task to a commit."
    />
    <meta
      name="keywords"
      content="agent task queue, parallel agent sessions, multi-agent coordination, Claude Code, Cursor, MCP, Model Context Protocol, agent orchestration, AI agents, shared agent state, agent workflow, Tandem, Tandem Canvas"
    />
    <link rel="canonical" href="https://tandemcanvas.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Tandem Canvas" />

    <!-- Open Graph (link previews on Slack, iMessage, LinkedIn, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tandem Canvas" />
    <meta property="og:title" content="Tandem — the shared state layer for parallel agent sessions" />
    <meta
      property="og:description"
      content="Running several Claude Code or Cursor sessions and coordinating them through a TODO.md? Tandem replaces that: a durable task queue sessions claim from without colliding, approval gates you set once, every task traceable to a commit, and a live board of who's doing what. Works with any MCP client."
    />
    <meta property="og:url" content="https://tandemcanvas.com/" />
    <meta property="og:image" content="https://tandemcanvas.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tandem — the shared state layer for parallel agent sessions" />
    <meta
      name="twitter:description"
      content="A durable task queue for parallel agent sessions. Sessions claim tasks without colliding, you approve an epic once, and every result links back to a commit. Claude Code, Cursor, any MCP client — no hacky TODO markdown files."
    />
    <meta name="twitter:image" content="https://tandemcanvas.com/og-image.png" />

    <!-- Structured data: helps search engines understand the brand + product.
         The FAQ mirrors the visible FAQ section on the landing page (they must
         stay in sync — Google penalises structured data that isn't on the page)
         and is what answer engines quote when asked how to coordinate parallel
         agent sessions. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Tandem Canvas",
            "alternateName": ["Tandem", "Tandem MCP"],
            "url": "https://tandemcanvas.com/"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Tandem Canvas",
            "alternateName": "Tandem — shared state layer for parallel agent sessions",
            "applicationCategory": "DeveloperApplication",
            "applicationSubCategory": "Agent task queue / MCP server",
            "operatingSystem": "Web",
            "url": "https://tandemcanvas.com/",
            "description": "The shared state layer for teams running parallel AI agent sessions. A durable task queue any agent session can claim from over the Model Context Protocol (MCP) without colliding — approve an epic once, watch a live board of who's doing what, and trace every task back to a commit. Works with Claude Code, Cursor, and any MCP client.",
            "keywords": "agent task queue, parallel agent sessions, multi-agent coordination, MCP, Model Context Protocol, Claude Code, Cursor, agent orchestration",
            "featureList": [
              "Durable task queue any agent session can claim from without collisions",
              "Approval gates — approve an epic once, sessions flow without per-step pings",
              "Task results traceable back to commits",
              "Live board of what every session is doing, updated over WebSocket",
              "Model Context Protocol (MCP) server — vendor-neutral, works with Claude Code, Cursor, and any MCP client"
            ],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is a shared state layer for agent sessions?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A place outside any single session where the coordination state lives: which tasks exist, which session claimed which, what's approved, what's done. In Tandem that's a durable task queue every agent session reads and writes over the Model Context Protocol, while you watch the same board live in a browser."
                }
              },
              {
                "@type": "Question",
                "name": "Which AI agents can connect to Tandem?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Any MCP-aware client. Claude Code, Claude Desktop, and claude.ai connect through the hosted connector or the npm package @jaximus/tandem-mcp; Cursor, agent frameworks, and custom orchestrators spawn the same stdio server. Many sessions can work the same queue at the same time."
                }
              },
              {
                "@type": "Question",
                "name": "Why not just keep a TODO.md in the repo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A markdown file is fine for one session. With several running in parallel it becomes the collision point: sessions clobber each other's edits, claims go stale, and nothing tells you who is doing what right now. Tandem splits it: intent lives in the repo — the spec stays in git — while the churn (claims, statuses, results) moves into a shared queue with per-task state."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need an account to use Tandem?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Create a canvas, get a short code, and share it — anyone with the code can open it in the browser and any agent session can join with the same code. Signing in with Google is only needed if you want to keep canvases in a dashboard or make one private."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- JetBrains Mono only — machine text (tickets, hashes, terminal content,
         canvas codes). Inter, the UI face, is self-hosted via fontsource. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
